<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RSA Programme</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; max-width: 700px; margin: auto; }
        h1 { color: #6a5acd; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #6a5acd; }
        label { display: inline-block; width: 120px; font-weight: bold; margin-bottom: 10px; }
        input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 200px; margin-bottom: 10px; }
        button { background-color: #6a5acd; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #483d8b; }
        .result-box { background: #e6e6fa; padding: 15px; border-radius: 8px; margin-top: 15px; font-family: monospace; font-size: 15px; color: #4b0082; word-break: break-all; }
        .radio-group { margin: 15px 0; padding: 10px; background: #f8f8ff; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>RSA Programme</h1>
    <p style="text-align: center; color: #666;">All mathematical calculations are handled by Matlab</p>

    <div class="card">
        <h3>Key Generation:</h3>
        <label>Input p:</label> <input type="number" id="inputP" value="61"><br>
        <label>Input q:</label> <input type="number" id="inputQ" value="53"><br>
        <button onclick="generateKeys()">Generate Key</button>
        
        <div class="result-box" id="keyResult">
            Public Key (n, e): generating...<br>
            Private Key (n, d): generating...
        </div>
    </div>

    <div class="card">
        <h3>🚀 Execution(Crypto)</h3>
        
        <div class="radio-group">
            <strong>Choose mode：</strong>
            <input type="radio" id="modeEnc" name="opMode" value="encrypt" checked>
            <label for="modeEnc" style="width: auto;">Encryption (Use e)</label>
            
            <input type="radio" id="modeDec" name="opMode" value="decrypt">
            <label for="modeDec" style="width: auto;">Decryption (Use d)</label>
        </div>

        <label>Key in(number):</label> 
        <input type="number" id="inputText" placeholder="Encrypted or decrypted text"><br>
        <button onclick="executeCrypto()">Proceed calculations</button>

        <div class="result-box">
            <strong>Results: </strong> <span id="cryptoResult" style="font-size: 18px; font-weight: bold; color: #ff1493;">...</span>
        </div>
    </div>

    <script>
        // 用来临时存从后端拿到的密钥，省得你个 dummy 还要自己填
        let global_n, global_e, global_d; 
        const serverURL = 'http://127.0.0.1:5000/api/rsa';

        async function generateKeys() {
            const p = document.getElementById('inputP').value;
            const q = document.getElementById('inputQ').value;
            const resBox = document.getElementById('keyResult');
            resBox.innerText = "calling backend";

            try {
                const response = await fetch(serverURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'keygen', p: p, q: q })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    global_n = data.n; global_e = data.e; global_d = data.d;
                    resBox.innerHTML = `Public Key (n, e): <strong>(${global_n}, ${global_e})</strong><br>Private Key (n, d): <strong>(${global_n}, ${global_d})</strong>`;
                } else {
                    resBox.innerText = "Error" + data.message;
                }
            } catch (err) {
                resBox.innerText = "Submission failed. Please run your python file.";
            }
        }

        async function executeCrypto() {
            const textVal = document.getElementById('inputText').value;
            const mode = document.querySelector('input[name="opMode"]:checked').value;
            const resSpan = document.getElementById('cryptoResult');

            if (!global_n) {
                alert("Private key has no generated.");
                return;
            }
            if (!textVal) {
                alert("Please insert numbers");
                return;
            }

            // 加密用 e，解密用 d
            const currentKey = (mode === 'encrypt') ? global_e : global_d;
            resSpan.innerText = "calculating...";

            try {
                const response = await fetch(serverURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'crypto', msg: textVal, key: currentKey, n: global_n })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    resSpan.innerText = data.result + " 😏";
                    // 贴心地把结果填进输入框，方便你连续测试
                    document.getElementById('inputText').value = data.result;
                    
                    // 贴心地自动切换模式
                    if(mode === 'encrypt') {
                        document.getElementById('modeDec').checked = true;
                    } else {
                        document.getElementById('modeEnc').checked = true;
                    }
                } else {
                    resSpan.innerText = "Error" + data.message;
                }
            } catch (err) {
                resSpan.innerText = "Server disconnected.";
            }
        }
    </script>
</body>
</html>
